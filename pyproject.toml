[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discwright"
version = "0.1.0.dev0"
description = "Turn GOG offline installers into burnable game discs with a custom icon, label and autorun menu, on Linux."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Pillow for the icons and the menu background, which is all that needs a
# library. The ISO is built by xorriso, a program rather than a Python package;
# see docs/xorriso-spike.md. 9.1 is the first Pillow with Image.Resampling;
# Ubuntu 24.04 ships 10.2 as python3-pil.
dependencies = ["Pillow>=9.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
discwright = "discwright.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
