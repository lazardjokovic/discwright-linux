name: csharp

# The C# DiscWright lives in app/, a copy of lazardjokovic/discwright at the
# commit named in WINDOWS-MAIN, with the Linux work growing beside it. Shared
# code is changed here, so every pull request has to prove two things: that the
# Windows app still passes its own suite, and that the shared half still builds
# on Linux.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  # The same two steps as app/.github/workflows/checks.yml, which GitHub does
  # not run from a subfolder. Kept in step with it by hand when Windows main is
  # caught up with.
  windows-suite:
    name: windows suite
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Which SDK
        run: dotnet --info
      - name: Build
        run: dotnet build DiscWright.slnx -c Release --nologo
      - name: The suite
        run: >
          dotnet test tests/DiscWright.Tests/DiscWright.Tests.csproj
          -c Release --no-build --nologo
          --logger "trx;LogFileName=suite.trx"
          --results-directory artifacts/test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: app/artifacts/test-results/*.trx
          if-no-files-found: ignore

  # The Windows app's own test files, compiled for Linux against the four
  # projects a Linux DiscWright shares with it. the-suite.py insists that
  # everything off the waiting list passes and that everything on it still
  # fails, so a fix cannot land without the list getting shorter.
  linux-suite:
    name: linux suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Which SDK
        run: dotnet --info
      # xorriso makes the image on Linux, and ARealImageFromXorriso runs the
      # real one. A missing xorriso fails those tests rather than excusing
      # them, so it is installed here by name and its version printed.
      - name: xorriso
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso
          xorriso -version 2>&1 | head -1
      - name: Build
        run: dotnet build tests/DiscWright.LinuxTests/DiscWright.LinuxTests.csproj -c Release --nologo
      - name: The suite
        run: python3 tests/DiscWright.LinuxTests/the-suite.py
      # The Linux window, opened for real with no screen and drawn with real
      # Skia. A step of its own because it is an xunit v3 project, which the
      # suite above is not, and it has no waiting list: every test passes.
      - name: Build the window and its tests
        run: dotnet build tests/DiscWright.LinuxAppTests/DiscWright.LinuxAppTests.csproj -c Release --nologo
      - name: The window's tests
        run: >
          dotnet test tests/DiscWright.LinuxAppTests/DiscWright.LinuxAppTests.csproj
          -c Release --no-build --nologo
          --logger "trx;LogFileName=window.trx"
          --results-directory artifacts/linux-test-results
      # The file people would download, started for real. The tests above run
      # the app out of its build folder, and the published file is put
      # together differently: it once died as it started while they passed.
      - name: The published app opens its window
        run: |
          sudo apt-get install -y -qq xvfb xdotool
          xvfb-run -a bash tools/see-the-published-app-start.sh
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results
          path: app/artifacts/linux-test-results/*.trx
          if-no-files-found: ignore
