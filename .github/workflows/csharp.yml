name: csharp

# The C# DiscWright lives in app/, a copy of lazardjokovic/discwright at the
# commit named in WINDOWS-MAIN, with the Linux work growing beside it. Shared
# code is changed here, so every pull request has to prove two things: that the
# Windows app still passes its own suite, and that the shared half still builds
# on Linux.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  # The same two steps as app/.github/workflows/checks.yml, which GitHub does
  # not run from a subfolder. Kept in step with it by hand when Windows main is
  # caught up with.
  windows-suite:
    name: windows suite
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Which SDK
        run: dotnet --info
      - name: Build
        run: dotnet build DiscWright.slnx -c Release --nologo
      - name: The suite
        run: >
          dotnet test tests/DiscWright.Tests/DiscWright.Tests.csproj
          -c Release --no-build --nologo
          --logger "trx;LogFileName=suite.trx"
          --results-directory artifacts/test-results
      # The Linux window's tests, here as well. They draw with no screen, so
      # they run anywhere, and one thing only Windows can tell them: a file
      # still held open after it was shown. Linux lets a held file be deleted
      # and Windows does not. The ones that need xorriso or a shell say
      # nothing here.
      - name: The Linux window's tests, on Windows
        run: >
          dotnet test tests/DiscWright.LinuxAppTests/DiscWright.LinuxAppTests.csproj
          -c Release --no-build --nologo
          --logger "trx;LogFileName=window.trx"
          --results-directory artifacts/test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: app/artifacts/test-results/*.trx
          if-no-files-found: ignore

  # The Windows app's own test files, compiled for Linux against the four
  # projects a Linux DiscWright shares with it. the-suite.py insists that
  # everything off the waiting list passes and that everything on it still
  # fails, so a fix cannot land without the list getting shorter.
  linux-suite:
    name: linux suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Which SDK
        run: dotnet --info
      # xorriso makes the image on Linux, and ARealImageFromXorriso runs the
      # real one. A missing xorriso fails those tests rather than excusing
      # them, so it is installed here by name and its version printed.
      - name: xorriso
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso
          xorriso -version 2>&1 | head -1
      - name: Build
        run: dotnet build tests/DiscWright.LinuxTests/DiscWright.LinuxTests.csproj -c Release --nologo
      - name: The suite
        run: python3 tests/DiscWright.LinuxTests/the-suite.py
      # The Linux window, opened for real with no screen and drawn with real
      # Skia. A step of its own because it is an xunit v3 project, which the
      # suite above is not, and it has no waiting list: every test passes.
      - name: Build the window and its tests
        run: dotnet build tests/DiscWright.LinuxAppTests/DiscWright.LinuxAppTests.csproj -c Release --nologo
      - name: The window's tests
        run: >
          dotnet test tests/DiscWright.LinuxAppTests/DiscWright.LinuxAppTests.csproj
          -c Release --no-build --nologo
          --logger "trx;LogFileName=window.trx"
          --results-directory artifacts/linux-test-results
      # The file people would download, started for real. The tests above run
      # the app out of its build folder, and the published file is put
      # together differently: it once died as it started while they passed.
      - name: The published app opens its window
        run: |
          sudo apt-get install -y -qq xvfb xdotool
          xvfb-run -a bash tools/see-the-published-app-start.sh
      # The download itself: put together, unpacked somewhere fresh, installed
      # into a home folder with nothing in it, started the way the menu
      # would, and taken out again. On its first run it found a menu entry
      # with carriage returns in it and libraries left behind in ~/.net.
      - name: The Linux download installs, starts and comes out again
        run: |
          sudo apt-get install -y -qq desktop-file-utils x11-utils file
          bash tools/make-the-linux-tarball.sh
          xvfb-run -a bash tools/see-the-linux-tarball-install.sh
      # The other way it is delivered: one file that carries its own xorriso,
      # built here from source and linked statically. Made and taken apart on
      # every pull request, the xorriso inside is put through DiscWright's
      # own tests, and it is started with no other xorriso to find.
      #
      # Not kept with the run. xorriso is under the GPL, and whether
      # DiscWright hands on a copy of it is the owner's to say first.
      - name: The Linux AppImage carries a xorriso that passes the tests
        run: |
          sudo apt-get install -y -qq musl-tools fuse3
          bash tools/make-the-linux-appimage.sh
          xvfb-run -a bash tools/see-the-linux-appimage-run.sh
      # Kept with the run so it can be tried on a real machine. Not a release:
      # nothing is tagged from here, and the name carries no version.
      - name: Upload the Linux download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DiscWright-linux-x64
          path: app/artifacts/DiscWright-linux-x64.tar.gz
          if-no-files-found: ignore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results
          path: app/artifacts/linux-test-results/*.trx
          if-no-files-found: ignore
      # Everything the look has, drawn on one sheet in each look by
      # ASheetOfTheLook, for the part of a look only an eye can judge.
      - name: Upload the look
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-look
          path: app/artifacts/the-look/*.png
          if-no-files-found: ignore
